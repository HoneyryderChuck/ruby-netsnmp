# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CI: 1

jobs:
  tests:
    name: >-
      ${{ matrix.os }} ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - "jruby"
          - "truffleruby"
    steps:
      - name: repo checkout
        uses: actions/checkout@v2
      - name: load ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        uses: adambirds/docker-compose-action@v1.5.0
        with:
          compose-file: |
            ./docker-compose.yml
            ./docker-compose-github.yml
            ./docker-compose-${{matrix.ruby}}.yml
          test-container: netsnmp
          test-command: /home/spec/support/specs.sh
        continue-on-error: ${{ matrix.ruby == 'head' || matrix.ruby == 'jruby' || matrix.ruby == 'truffleruby' }}
      - name: Run tests without xorcist
        uses: adambirds/docker-compose-action@v1.5.0
        with:
          compose-file: |
            ./docker-compose.yml
            ./docker-compose-github.yml
            ./docker-compose-${{matrix.ruby}}.yml
          test-container: netsnmp_no_xorcist
          test-command: /home/spec/support/specs.sh
        if: ${{ matrix.ruby == '4.0' }}
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{matrix.ruby}}
          path: coverage/
          include-hidden-files: true

  coverage:
    permissions:
      id-token: write
      pages: write
      checks: write
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0
          bundler-cache: true

      - name: Download coverage results
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage

      - name: coverage
        env:
          COVERAGE_DIR: coverage/merged
        run: |
          # rewrite mac paths
          find coverage -name "*resultset.json" -exec sed -i 's|/Users/runner/work/idnx/idnx|${{ github.workspace }}|g' {} \;
          # rewrite window paths
          find coverage -name "*resultset.json" -exec sed -i 's|D:/a/idnx/idnx|${{ github.workspace }}|g' {} \;
          bundle exec rake coverage:report

      - name: Upload simplecov results
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage
        if: github.ref == 'refs/heads/master'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/master'

      - name: Check coverage
        uses: srozen/simplecov-check-action@support-simplecov-1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          coverage_path: 'coverage/merged/.last_run.json'
          coverage_json_path: 'coverage/merged/coverage.json'
          minimum_suite_coverage: 89